name: Build & Release

# Pushing to these branches builds a CLEAN release and publishes it:
#   nightly -> rolling prerelease "nightly" (overwritten on every push)
#   stable  -> permanent release tagged stable-YYYYMMDD-<sha>, marked latest
on:
  push:
    branches: [nightly, stable]

permissions:
  contents: write

jobs:
  tests:
    name: Host test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run doctest suite
        run: make -C tests

  build-release:
    name: Clean build + release
    needs: tests
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      # ALWAYS a clean build. Incremental builds once shipped binaries with
      # mismatched struct layouts (see the note in the Makefile) — CI exists
      # so that can never happen again.
      - name: Build .cia/.3dsx (devkitARM container)
        run: |
          docker run --rm -v "$PWD":/snes9x_3ds -w /snes9x_3ds \
            devkitpro/devkitarm bash -c "make clean && make release"
          ls -la output/snes9x_3ds.cia output/snes9x_3ds.3dsx

      - name: Backfill release notes (idempotent)
        run: |
          for f in .github/release-notes/*.md; do
            tag=$(basename "$f" .md)
            gh release edit "$tag" --notes-file "$f" 2>/dev/null || true
          done

      - name: Publish nightly (rolling prerelease)
        if: github.ref_name == 'nightly'
        run: |
          SHORT=${GITHUB_SHA::7}
          # tag is nightly-latest (NOT "nightly") so it never collides with the branch name
          gh release delete nightly-latest --yes || true
          git push origin :refs/tags/nightly-latest || true
          # release notes = the CHANGELOG's Unreleased section
          {
            echo "Automated nightly build from \`$SHORT\`. For testing; may be unstable."
            echo
            awk '/^## Unreleased/{f=1;next}/^## /{f=0}f' CHANGELOG.md
          } > /tmp/notes.md
          gh release create nightly-latest \
            output/snes9x_3ds.cia output/snes9x_3ds.3dsx \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Nightly $(date -u +%Y-%m-%d) ($SHORT)" \
            --notes-file /tmp/notes.md

      - name: Publish stable release
        if: github.ref_name == 'stable'
        run: |
          SHORT=${GITHUB_SHA::7}
          TAG="stable-$(date -u +%Y%m%d)-$SHORT"
          # the app version rides in the title so the in-emulator updater
          # can offer stable in version language ("v2.1"), not sha jargon
          MAJOR=$(sed -n 's/^APP_VERSION_MAJOR *= *//p' resources/AppInfo)
          MINOR=$(sed -n 's/^APP_VERSION_MINOR *= *//p' resources/AppInfo)
          MICRO=$(sed -n 's/^APP_VERSION_MICRO *= *//p' resources/AppInfo)
          VER="$MAJOR.$MINOR"; [ "$MICRO" != "0" ] && VER="$VER.$MICRO"
          # release notes = the CHANGELOG's Unreleased section
          awk '/^## Unreleased/{f=1;next}/^## /{f=0}f' CHANGELOG.md > /tmp/notes.md
          gh release create "$TAG" \
            output/snes9x_3ds.cia output/snes9x_3ds.3dsx \
            --latest \
            --target "$GITHUB_SHA" \
            --title "Stable v$VER ($(date -u +%Y-%m-%d))" \
            --notes-file /tmp/notes.md
